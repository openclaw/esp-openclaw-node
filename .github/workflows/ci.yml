name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: component-test-app-build
            path: components/esp-openclaw-node/test_apps/esp_openclaw_node_unity_tests
            target: esp32s3
          - name: esp32-node
            path: examples/esp32-node
            target: esp32s3
          - name: esp-box-3-display
            path: examples/esp-box-3-display
            target: esp32s3
          - name: waveshare-amoled-room-node
            path: examples/waveshare-esp32-s3-touch-amoled-2.06-room-node
            target: esp32s3
          - name: m5stack-tab5-room-node
            path: examples/m5stack-tab5-room-node
            target: esp32p4

    name: ${{ matrix.name }} (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Host file validation tests
        if: matrix.name == 'component-test-app-build'
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I components/esp-openclaw-room-node \
            components/esp-openclaw-room-node/room_file_validation.c \
            components/esp-openclaw-room-node/tests/test_room_file_validation.c \
            -o /tmp/room_file_validation_test
          /tmp/room_file_validation_test

      - name: Host room audio tests
        if: matrix.name == 'component-test-app-build'
        run: |
          python3 components/esp-openclaw-room-node/tests/test_room_audio_port_compat.py
          cc -std=c11 -Wall -Wextra -Werror \
            -I components/esp-openclaw-room-node \
            components/esp-openclaw-room-node/room_diagnostics_metrics.c \
            components/esp-openclaw-room-node/tests/test_room_diagnostics_metrics.c \
            -o /tmp/room_diagnostics_metrics_test
          /tmp/room_diagnostics_metrics_test
          cc -std=c11 -Wall -Wextra -Werror \
            -I components/esp-openclaw-room-node \
            components/esp-openclaw-room-node/room_pcm_gain.c \
            components/esp-openclaw-room-node/tests/test_room_pcm_gain.c \
            -lm -o /tmp/room_pcm_gain_test
          /tmp/room_pcm_gain_test

      - name: Firmware packaging tests
        if: matrix.name == 'component-test-app-build'
        run: python3 -m unittest discover -s scripts/tests -p 'test_package_firmware.py' -v

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v5.5
          target: ${{ matrix.target }}
          path: ${{ matrix.path }}
          command: |
            idf.py reconfigure &&
            ninja -C build -j2 &&
            if [ "${{ matrix.name }}" = "component-test-app-build" ]; then
              python3 ../../../esp-openclaw-talk/tests/run_host_tests.py --sanitize &&
              python3 ../../../esp-openclaw-talk/tests/run_threaded_tests.py &&
              python3 -m unittest discover -s ../../../../scripts/tests -p test_package_firmware.py -k lock_reader -v
            fi &&
            if [ "${{ matrix.name }}" = "waveshare-amoled-room-node" ]; then
              python3 ../../components/esp-openclaw-room-node/tests/run_lifecycle_host_tests.py --managed-components managed_components &&
              python3 ../../components/esp-openclaw-room-node/tests/run_ui_host_tests.py --lvgl-dir managed_components/lvgl__lvgl
            fi &&
            if [ "${{ matrix.name }}" != "component-test-app-build" ]; then
              python3 ../../scripts/package_firmware.py \
                --target "${{ matrix.target }}" \
                --repository "${{ github.repository }}" \
                --event "${{ github.event_name }}" \
                --event-sha "${{ github.sha }}" \
                --pr-head-sha "${{ github.event.pull_request.head.sha }}" \
                --run-id "${{ github.run_id }}" \
                --run-attempt "${{ github.run_attempt }}" \
                --idf-image "espressif/idf:release-v5.5"
            fi

      - name: Upload firmware
        if: matrix.name != 'component-test-app-build'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ matrix.path }}/build/firmware/
          if-no-files-found: error
